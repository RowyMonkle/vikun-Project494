
services:
  nginx:
    image: nginx:latest
    container_name: nginx_container
    ports:
      - "80:80"
    volumes:
      - D:/DomePakolam494/Proj02-vikunja/vikun-Project494/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
    networks:
      - vikunja-net

  api:
      image: vikunja/vikunja:latest
      container_name: vikunja-app
      restart: unless-stopped
      user: "0:0"
      environment: 
        VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_SERVICE_PUBLICURL}
        VIKUNJA_DATABASE_HOST: postgres
        VIKUNJA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
        VIKUNJA_DATABASE_TYPE: postgres
        VIKUNJA_DATABASE_USER: ${POSTGRES_USER}
        VIKUNJA_DATABASE_DATABASE: ${POSTGRES_DB}
        VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SECRET}
        # Redis settings
        VIKUNJA_REDIS_ENABLED: 1
        VIKUNJA_REDIS_HOST: 'redis:6379'
        VIKUNJA_CACHE_ENABLED: ${VIKUNJA_CACHE_ENABLED}
        VIKUNJA_CACHE_TYPE: redis
        # storage settings
        VIKUNJA_FILE_STORAGE_TYPE: ${VIKUNJA_FILE_STORAGE_TYPE}
        VIKUNJA_FILE_STORAGE_PATH: ${VIKUNJA_FILE_STORAGE_PATH}
      volumes:
        - vikunja-files:${VIKUNJA_FILE_STORAGE_PATH}
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_started
      networks:
        - vikunja-net

  postgres:
    image: postgres:15-alpine
    container_name: vikunja-db
    restart: unless-stopped
    environment:
    #from .env file
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - vikunja-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vikunja-net

  redis:
    image: redis:7-alpine
    container_name: vikunja-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
        postgres:
          condition: service_healthy
    networks:
        - vikunja-net

volumes:
  vikunja-db-data:
  vikunja-files:

networks:
  vikunja-net:
    driver: bridge